---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: test-js

on: # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:

env:
  GOOS: js
  GOARCH: wasm

jobs:
  test-js:
    name: test-js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-go@v7
        with:
          go-version-file : go.mod
          check-latest: true
          cache: true

      - run: printf '::notice ::%s\n' "$(go version)"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: |
          # Run Go js/wasm test in node.js
          printf '::notice ::%s\n' "$(go version)"
          GOROOT=$(go env GOROOT)
          cp "${GOROOT}/lib/wasm/wasm_exec.js" .
          go test -exec="${GOROOT}/lib/wasm/go_js_wasm_exec" -covermode=atomic -coverprofile=coverage.out -coverpkg=. -v .
          sed -i.bak "/compat\/cmd\//d; /compat\/golang\//d;" coverage.out
          rm -f *.bak

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          # fail_ci_if_error: false
          files: ./coverage.out
          name: coverage-${{ env.GOOS }}
          token: ${{ secrets.CODECOV_TOKEN }}

permissions:
  contents: read
