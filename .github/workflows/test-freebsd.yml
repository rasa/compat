---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: test-freebsd

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      GOOPTS:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      GOOPTS:
        type: string
        default: ''
        description: 'Build/test options (eg: -tags fstat)'

env:
  CODECOV_SLUG: ${{ github.repository }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  GOOS: freebsd
  GOARCH: amd64
  GOOPTS: ${{ inputs.GOOPTS }}

jobs:
  test-freebsd:
    name: test-freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
    
      - uses: vmactions/freebsd-vm@v1
        with:
          # arch: aarch64
          # copyback: false
          envs: 'GOOS GOARCH GOOPTS CODECOV_SLUG CODECOV_TOKEN' # GITHUB_TOKEN'
          prepare: |
            pkg update -f
            pkg install -y bash curl git gzip gtar jq
            # pkg install -y go
          # release: '15.0'
          run: |
            ./download-build-test.sh
          sync: scp
          usesh: true

      - uses: codecov/codecov-action@v7
        with:
          # fail_ci_if_error: false
          files: ./coverage.out
          name: coverage-${{ env.GOOS }}
          token: ${{ secrets.CODECOV_TOKEN }}

permissions:
  contents: read
