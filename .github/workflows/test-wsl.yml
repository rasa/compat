---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: test-wsl

on: # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:

jobs:
  test-wsl:
    name: test-wsl
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - run: wsl --list --online
      - run: wsl --set-default-version 2
      - run: wsl --status
      - run: wsl --version
      - run: wsl --help
      - run: wsl --install -d Ubuntu
      - run: wsl bash -c "apt update"
      - run: wsl bash -c "apt install -y golang
      - run: wsl bash -c "go version"
      - run: wsl bash -c "go mod download"
      - run: wsl bash -c "go build -tags debug -trimpath ./..."
      - run: wsl bash -c "go test -v ./..."
