---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: test-illumos

on: # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:

env:
  CODECOV_SLUG: ${{ github.repository }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  GOOS: illumos
  GOARCH: amd64

jobs:
  test-illumos:
    name: test-illumos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - uses: vmactions/omnios-vm@v1
        with:
          envs: 'GOOS GOARCH CODECOV_SLUG CODECOV_TOKEN' # GITHUB_TOKEN'
          usesh: true
          # copyback: false
          prepare: |
            pkg install shell/bash web/curl developer/versioning/git compress/gzip archiver/gnu-tar util/jq
            # add developer/gcc14 for CGO
          run: |
            ./download-build-test.sh

      - uses: codecov/codecov-action@v7
        with:
          # fail_ci_if_error: false
          files: ./coverage.out
          name: coverage-${{ env.GOOS }}
          token: ${{ secrets.CODECOV_TOKEN }}

permissions:
  contents: read
