---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: test-all-bsds

on:
  workflow_call:
    inputs:
      GOOPTS:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      GOOPTS:
        type: string
        default: ''
        description: 'Build/test options (eg: -tags fstat)'

jobs:
  test-dragonflybsd:
    uses: ./.github/workflows/test-dragonflybsd.yml
    secrets: inherit
    with:
      GOOPTS: ${{ inputs.GOOPTS }}
  test-freebsd:
    uses: ./.github/workflows/test-freebsd.yml
    # needs: test-dragonflybsd
    # if: success()
    secrets: inherit
    with:
      GOOPTS: ${{ inputs.GOOPTS }}
  test-netbsd:
    uses: ./.github/workflows/test-netbsd.yml
    # needs: test-freebsd
    # if: success()
    secrets: inherit
    with:
      GOOPTS: ${{ inputs.GOOPTS }}
  test-openbsd:
    uses: ./.github/workflows/test-openbsd.yml
    # needs: test-netbsd
    # if: success()
    secrets: inherit
    with:
      GOOPTS: ${{ inputs.GOOPTS }}

permissions:
  contents: read
