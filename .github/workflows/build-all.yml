---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: build-all

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      runner: all
    secrets: inherit
  build-nocgo:
    uses: ./.github/workflows/build-nocgo.yml
    with:
      goarches: all
    needs: build-matrix
    if: success()
    secrets: inherit
  build-android:
    uses: ./.github/workflows/build-android.yml
    needs: build-nocgo
    if: success()
    secrets: inherit
  build-ios:
    uses: ./.github/workflows/build-ios.yml
    needs: build-android
    if: success()
    secrets: inherit
