---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: build-root

on: # yamllint disable-line rule:truthy
  workflow_call: # Required so this workflow can be called from another workflow
    inputs:
      compat_debug:
        default: ''
        type: string # required
      image:
        default: '24.04'
        type: string # required
      test_opts:
        default: '-v'
        type: string
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
    inputs:
      # checkov:skip=CKV_GHA_7: The build output cannot be affected by user parameters...
      compat_debug:
        description: 'COMPAT_DEBUG environmental variable.'
        default: ''
        type: string
      # checkov:skip=CKV_GHA_7: The build output cannot be affected by user parameters...
      image:
        description: 'Ubuntu image to use'
        type: choice
        options:
          - '26.o4'
          - '24.04'
          - '22.04'
          - 'all'
        default: '24.04'
      # checkov:skip=CKV_GHA_7: The build output cannot be affected by user parameters...
      test_opts:
        description: 'Test options (eg: -v -run TestX -short -tags debug)'
        default: '-v'
        type: string

jobs:
  build-root:
    name: build-root
    strategy:
      fail-fast: false
      matrix:
        image:
          - '26.04'
          - '24.04'
          - '22.04'

    runs-on: ubuntu-26.04
    container:
      image: ubuntu:${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Set SHOULD_RUN var for ubuntu:${{ inputs.image }}
        run: |
          echo 'SHOULD_RUN=yes' >> "${GITHUB_ENV}"
          printf '::notice::inputs.image=%s\n' "${{ inputs.image }}"
        if: >
          (matrix.image == inputs.image || inputs.image == 'all') &&
          !(contains(matrix.image, 'arm') && github.repository_visibility == 'public')

      - uses: actions/checkout@v7
        if: env.SHOULD_RUN
        with:
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-go@v7
        if: env.SHOULD_RUN
        with:
          go-version-file : go.mod
          check-latest: true
          cache: true

      - run: printf '::notice ::%s\n' "$(go version)"
        if: env.SHOULD_RUN

      - name: Set env vars (GOCACHE, GOMODCACHE and inputs)
        if: env.SHOULD_RUN
        run: |
          # Set env vars (GOCACHE, GOMODCACHE and inputs)
          printf 'GOCACHE=%s\n'    "$(go env GOCACHE | tr '\\' '/')" >>"${GITHUB_ENV}"
          printf 'GOMODCACHE=%s\n' "$(go env GOMODCACHE | tr '\\' '/')" >>"${GITHUB_ENV}"

      - name: USE actions/cache to save Go's build and mod caches
        if: env.SHOULD_RUN
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: go test
        if: env.SHOULD_RUN
        env:
          COMPAT_DEBUG: ${{ inputs.compat_debug }}
          DEBIAN_FRONTEND: noninteractive
          TERM: dumb
          TEST_OPTS: ${{ inputs.test_opts }}
          TZ: UTC
        run: |
          # go test
          printf 'TEST_OPTS="%s"\n' "${TEST_OPTS}"

          apt-get update

          PACKAGES=(
            btrfs-progs
            dosfstools
            e2fsprogs
            exfatprogs
            f2fs-tools
            ntfs-3g
            xfsprogs
            kmod
            util-linux
            reiserfsprogs
            "linux-modules-$(uname -r)"
            "linux-modules-extra-$(uname -r)"
          )

          for package in "${PACKAGES[@]}"; do
            apt-get install -y "${package}" || true
          done

          MODULES=(
            loop
            btrfs
            exfat
            f2fs
            ntfs3
            reiserfs
            xfs
          )

          for module in "${MODULES[@]}"; do
            modprobe "${module}" || true
          done

          go version

          go test "${TEST_OPTS}" .

permissions:
  contents: read
