---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: test-tinygo

"on":
  workflow_call:
  workflow_dispatch:

env:
  # See https://github.com/webassembly/binaryen/releases
  BINARYEN_VERSION: '132'
  GODEBUG: 'toolchaintrace=1'
  GOTOOLCHAIN: local

jobs:
  test-tinygo:
    name: test-tinygo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        go-version:
          - big: '1.26.x'
            # https://github.com/tinygo-org/tinygo/releases
            tiny: '0.41.1'
          - big: '1.25.x'
            tiny: '0.39.0'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version.big }}
          check-latest: true
          cache: true

      - run: printf '::notice ::%s\n' "$(go version)"

      - run: go mod download

      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: ${{ matrix.go-version.tiny }}
          binaryen-version: ${{ env.BINARYEN_VERSION }}

      - run: tinygo test -tags tinygo -v ./...

permissions:
  contents: read
