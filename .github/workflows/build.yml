---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: build

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      # - '.github/workflows/*'
      # - '.goreleaser.yml'
      # - 'Makefile'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      # - '.github/workflows/*'
      # - '.goreleaser.yml'
  workflow_call:
    inputs:
      compat_debug:
        default: "ACLS"
        type: string
      compat_debug_fs:
        default: "All"
        type: string
      enabled:
        default: true
        type: boolean
      make_cmd:
        default: "ci"
        type: string
      runner:
        default: "ubuntu-24.04"
        type: string
      sudo:
        default: true
        type: boolean
      test_opts:
        default: ""
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

  workflow_dispatch:
    inputs:
      compat_debug:
        description: "COMPAT_DEBUG environment variable"
        default: "ACLS"
        type: string
      compat_debug_fs:
        description: "COMPAT_DEBUG_FS environment variable"
        default: "All"
        type: string
      enabled:
        description: "Run action (required, do not uncheck)"
        default: true
        type: boolean
      make_cmd:
        description: "Make command"
        default: "ci"
        type: string
      runner:
        description: "GitHub runner to use"
        default: "ubuntu-24.04"
        type: choice
        options:
          - ubuntu-26.04
          - windows-2025
          - macos-26 # arm64
          - ---previous-releases---
          - ubuntu-24.04 # ubuntu-latest
          - ubuntu-22.04
          - macos-15 # arm64
          - windows-2022 # windows-latest
          - ---arm-variations---
          - ubuntu-26.04-arm
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - windows-11-arm
          - macos-26-xlarge # arm64
          - ---amd-variations---
          - macos-26-large # amd64
          - macos-26-intel # amd64
          - macos-15-large # amd64
          - ---older-releases---
          - macos-14 # arm64 # macos-latest
          - macos-14-large # amd64
      sudo:
        description: "Run tests via sudo"
        default: true
        type: boolean
      test_opts:
        description: "Options passed to go test"
        default: ""
        type: string

permissions:
  contents: read

env:
  COMPAT_DEBUG: ${{ inputs.compat_debug }}
  COMPAT_DEBUG_FS: ${{ inputs.compat_debug_fs }}
  MAKE_CMD: ${{ inputs.make_cmd }}
  TEST_OPTS: ${{ inputs.test_opts }}

jobs:
  build:
    name: build
    if: inputs.enabled
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Set environment variables
        run: |
          if [[ "${{ inputs.sudo }}" == "true" ]]; then
            if builtin command -v sudo &>/dev/null; then
              if [[ ! "${OS:-}" =~ [Ww]indows ]]; then
                # isn't this redudent:
                # --preserve-env=PATH,COMPAT_DEBUG,COMPAT_DEBUG_FS,TEST_OPTS
                sudo='sudo -E -n'
              fi
            fi
          fi
          printf "GOCACHE=%s\n" "$(go env GOCACHE | tr '\\' '/')" >>"${GITHUB_ENV}"
          printf "GOMODCACHE=%s\n" "$(go env GOMODCACHE | tr '\\' '/')" >>"${GITHUB_ENV}"
          printf "GOVERSION=%s\n" "$(go version | sed 's|^.*go||; s| .*||;')" >>"${GITHUB_ENV}"
          printf "sudo=%s\n" "${sudo:-}" >>"${GITHUB_ENV}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            printf "UMASK=022\n" >>"${GITHUB_ENV}"
          fi
          # cat "${GITHUB_ENV}"

      - name: make ${{ inputs.make_cmd }}
        run: |
          set -x
          : "${COMPAT_DEBUG:=}"
          : "${COMPAT_DEBUG_FS:=}"
          : "${GOCACHE:=}"
          : "${GOMODCACHE:=}"
          : "${GOVERSION:=}"
          : "${PATH:=}"
          : "${TEST_OPTS:=}"
          printf 'COMPAT_DEBUG   ="%s"\n' "${COMPAT_DEBUG}"
          printf 'COMPAT_DEBUG_FS="%s"\n' "${COMPAT_DEBUG_FS}"
          printf 'GOCACHE        ="%s"\n' "${GOCACHE}"
          printf 'GOMODCACHE     ="%s"\n' "${GOMODCACHE}"
          printf 'GOVERSION      ="%s"\n' "${GOVERSION}"
          printf 'PATH           ="%s"\n' "${PATH}"
          printf 'TEST_OPTS      ="%s"\n' "${TEST_OPTS}"
          ${sudo:-} env "PATH=${PATH}" make "${MAKE_CMD}" TEST_OPTS="${TEST_OPTS:-}"
          test -d ./dist || exit 0
          test -n "${sudo:-}" || exit 0
          ${sudo:-} chown -R "$(id -un)":"$(id -gn)" ./dist "${GOCACHE:-}" "${GOMODCACHE:-}" || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          files: ./coverage.out
          name: coverage-${{ runner.os }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ runner.os }}
          path: coverage.*

      - name: go tool goreleaser release --clean --snapshot
        if: inputs.make_cmd != 'test' && runner.os == 'Linux'
        run: |
          if [[ -f go.tool.mod ]]; then
            export GOFLAGS="${GOFLAGS:-} -modfile=go.tool.mod"
          fi
          go tool goreleaser release --clean --snapshot

      - name: Upload dist
        if: inputs.make_cmd != 'test' && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.runner }}
          path: dist
