---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: test-all

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-top3:
    uses: ./.github/workflows/build-matrix.yml
    with:
      runner: top3
      make_cmd: test
    secrets: inherit
  test-android:
    # if: success()
    uses: ./.github/workflows/test-android.yml
    needs: test-top3
    secrets: inherit
  test-ios:
    # if: success()
    uses: ./.github/workflows/test-ios.yml
    needs: test-android
    secrets: inherit
  test-plan9:
    # if: success()
    uses: ./.github/workflows/test-plan9.yml
    needs: test-ios
    secrets: inherit
  test-tiny:
    # if: success()
    uses: ./.github/workflows/test-tiny.yml
    needs: test-plan9
    secrets: inherit
  test-all-wasms:
    # if: success()
    uses: ./.github/workflows/test-all-wasms.yml
    needs: test-tiny
    secrets: inherit
  test-all-vms:
    # if: success()
    uses: ./.github/workflows/test-all-vms.yml
    needs: test-all-wasms
    secrets: inherit
