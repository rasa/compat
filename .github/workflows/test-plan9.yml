---
name: test-plan9

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANYVM_COMMIT: "main"
  GO_VERSION: "1.26.5"
  PLAN9_RELEASE: "11554"
  SSH_PORT: "10023"

jobs:
  test-plan9:
    runs-on: ubuntu-26.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Check out AnyVM
        uses: actions/checkout@v7
        with:
          repository: anyvm-org/anyvm
          ref: ${{ env.ANYVM_COMMIT }}
          path: .anyvm
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare Plan 9 test
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get --no-install-recommends -y install \
            ca-certificates \
            expect \
            inetutils-telnet \
            qemu-system-x86 \
            qemu-utils \
            zstd

          stage="${RUNNER_TEMP}/plan9-stage"

          rm -rf "${stage}"
          mkdir -p "${stage}"

          # Build one native Plan 9 test executable.
          CGO_ENABLED=0 \
          GOOS=plan9 \
          GOARCH=amd64 \
            go test \
              -c \
              -mod=readonly \
              -tags debug \
              -covermode=atomic \
              -coverpkg=. \
              -o "${stage}/compat.test" \
              .

          # Preserve the test's expected relative working directory.
          if [[ -d testdata ]]; then
            cp -a testdata "${stage}/"
          fi

          echo "Files to transfer:"
          du -ah "${stage}"

      - name: Run tests in Plan 9
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import socket
          import sys
          import time

          HOST = "127.0.0.1"
          PORT = int(os.environ["SSH_PORT"])
          TIMEOUT = 30 * 60

          IAC = 255
          SE = 240
          SB = 250
          WILL = 251
          WONT = 252
          DO = 253
          DONT = 254

          PASS = b"__PLAN9_PASS__"
          FAIL = b"__PLAN9_FAIL__"

          def connect():
              last_error = None

              for _ in range(20):
                  try:
                      return socket.create_connection(
                          (HOST, PORT),
                          timeout=15,
                      )
                  except OSError as error:
                      last_error = error
                      time.sleep(3)

              raise RuntimeError(
                  f"Could not connect to Plan 9: {last_error}"
              )

          sock = connect()
          sock.settimeout(0.5)

          pending = bytearray()
          output = bytearray()

          def process_telnet(data):
              global pending

              data = pending + data
              pending = bytearray()

              visible = bytearray()
              i = 0

              while i < len(data):
                  if data[i] != IAC:
                      visible.append(data[i])
                      i += 1
                      continue

                  if i + 1 >= len(data):
                      pending.extend(data[i:])
                      break

                  command = data[i + 1]

                  if command == IAC:
                      visible.append(IAC)
                      i += 2
                      continue

                  if command in (DO, DONT, WILL, WONT):
                      if i + 2 >= len(data):
                          pending.extend(data[i:])
                          break

                      option = data[i + 2]

                      if command == DO:
                          sock.sendall(bytes((IAC, WONT, option)))
                      elif command == WILL:
                          sock.sendall(bytes((IAC, DONT, option)))

                      i += 3
                      continue

                  if command == SB:
                      end = data.find(bytes((IAC, SE)), i + 2)

                      if end == -1:
                          pending.extend(data[i:])
                          break

                      i = end + 2
                      continue

                  i += 2

              return bytes(visible)

          def read_for(seconds):
              end = time.monotonic() + seconds

              while time.monotonic() < end:
                  try:
                      data = sock.recv(4096)
                  except socket.timeout:
                      continue

                  if not data:
                      return False

                  visible = process_telnet(data)

                  if visible:
                      sys.stdout.buffer.write(visible)
                      sys.stdout.buffer.flush()
                      output.extend(visible)

                  if PASS in output or FAIL in output:
                      return True

              return False

          # Consume the initial Telnet negotiation/banner.
          read_for(2)

          sock.sendall(b"cd /usr/glenda/work\r\n")
          read_for(1)

          command = (
              # "COMPAT_DEBUG=ACLS; "
              # "COMPAT_DEBUG_FS=All; "
              "./compat.test "
              "-test.count=1 "
              "-test.timeout=20m "
              "-test.v "
              "-test.coverprofile=coverage.out; "
              "teststatus=$status; "
              "if(~ $teststatus '') echo __PLAN9_^PASS__; "
              "if(! ~ $teststatus '') echo __PLAN9_^FAIL__"
              "\r\n"
          )

          sock.sendall(command.encode())

          deadline = time.monotonic() + TIMEOUT

          while time.monotonic() < deadline:
              if read_for(1):
                  break
          else:
              print(
                  "\nTimed out running Plan 9 tests",
                  file=sys.stderr,
              )
              raise SystemExit(124)

          passed = PASS in output

          try:
              sock.sendall(b"fshalt\r\n")
              read_for(3)
          except OSError:
              pass
          finally:
              sock.close()

          raise SystemExit(0 if passed else 1)
          PY
