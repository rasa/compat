---
name: test-plan9

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANYVM_COMMIT: "main"
  GO_VERSION: "1.26.5"
  # See https://github.com/anyvm-org/anyvm/blob/main/.github/workflows/plan9.yml#L30
  PLAN9_RELEASE: "11554"
  SSH_PORT: 10023

jobs:
  test-plan9:
    runs-on: ubuntu-26.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Check out AnyVM
        uses: actions/checkout@v7
        with:
          repository: anyvm-org/anyvm
          ref: ${{ env.ANYVM_COMMIT }}
          path: .anyvm

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare Plan 9
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get --no-install-recommends -y install \
            ca-certificates \
            expect \
            inetutils-telnet \
            qemu-system-x86 \
            qemu-utils \
            zstd

          # Avoid downloading modules from inside Plan 9.
          go mod vendor

          mkdir -p .plan9

          curl -fsSLo "${RUNNER_TEMP}/go-plan9.tar.gz" \
            "https://go.dev/dl/go${GO_VERSION}.plan9-amd64.tar.gz"

          tar -xzf "${RUNNER_TEMP}/go-plan9.tar.gz" -C .plan9

      - name: Boot Plan 9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          python3 .anyvm/anyvm.py \
            --os plan9 \
            --release "${PLAN9_RELEASE}" \
            --data-dir "${RUNNER_TEMP}/anyvm-data" \
            --ssh-port "${SSH_PORT}" \
            --sync 9p \
            -v "${GITHUB_WORKSPACE}:/usr/glenda/work" \
            -d \
            --remote-vnc off

      - name: Run tests in Plan 9
        shell: bash
        run: |
          set -euo pipefail

          rm -f .plan9-pass

          expect <<'EOF'
          set timeout 1800

          spawn telnet 127.0.0.1 ${{ env.SSH_PORT }}
          expect "term%"

          send -- "cd /usr/glenda/work; if (.plan9/go/bin/go test -count=1 -timeout=20m -mod=vendor -tags debug -v -covermode=atomic -coverprofile=coverage.out -coverpkg=. .) touch .plan9-pass\r"

          expect "term%"
          send -- "fshalt\r"
          expect eof
          EOF

          test -f .plan9-pass
