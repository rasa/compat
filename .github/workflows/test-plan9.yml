---
name: test-plan9

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANYVM_COMMIT: "main"
  GO_VERSION: "1.26.5"
  PLAN9_RELEASE: "11554"
  SSH_PORT: "10023"

jobs:
  test-plan9:
    runs-on: ubuntu-26.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: Check out AnyVM
        uses: actions/checkout@v7
        with:
          repository: anyvm-org/anyvm
          ref: ${{ env.ANYVM_COMMIT }}
          path: .anyvm
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare Plan 9 test
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get --no-install-recommends -y install \
            ca-certificates \
            expect \
            inetutils-telnet \
            qemu-system-x86 \
            qemu-utils \
            zstd

          stage="${RUNNER_TEMP}/plan9-stage"

          rm -rf "${stage}"
          mkdir -p "${stage}"

          # Build one native Plan 9 test executable.
          CGO_ENABLED=0 \
          GOOS=plan9 \
          GOARCH=amd64 \
            go test \
              -c \
              -mod=readonly \
              -tags debug \
              -covermode=atomic \
              -coverpkg=. \
              -o "${stage}/compat.test" \
              .

          # Preserve the test's expected relative working directory.
          if [[ -d testdata ]]; then
            cp -a testdata "${stage}/"
          fi

          echo "Files to transfer:"
          du -ah "${stage}"

      - name: Boot Plan 9 and run tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          stage="${RUNNER_TEMP}/plan9-stage"

          # Avoid nested-KVM LBR/PMU problems under act.
          if [[ "${ACT:-}" == "true" ]]; then
            sudo rm -f /dev/kvm
          fi

          # Transfer only compat.test and testdata.
          timeout --signal=TERM 15m \
            python3 .anyvm/anyvm.py \
              --os plan9 \
              --release "${PLAN9_RELEASE}" \
              --data-dir "${RUNNER_TEMP}/anyvm-data" \
              --ssh-port "${SSH_PORT}" \
              --sync 9p \
              -v "${stage}:/usr/glenda/work" \
              -d \
              --remote-vnc off

          expect <<'EOF'
          set timeout 1800
          set result 1

          spawn telnet 127.0.0.1 $env(SSH_PORT)

          expect {
            "term%" {}
            timeout {
              puts stderr "Timed out waiting for Plan 9"
              exit 124
            }
            eof {
              puts stderr "Could not connect to Plan 9"
              exit 125
            }
          }

          send -- "cd /usr/glenda/work\r"
          expect "term%"

          send -- "chmod +x compat.test\r"
          expect "term%"

          send -- "./compat.test -test.count=1 -test.timeout=20m -test.v -test.coverprofile=coverage.out; teststatus=\$status\r"

          expect {
            "term%" {}
            timeout {
              puts stderr "Timed out running Plan 9 tests"
              exit 124
            }
            eof {
              puts stderr "Plan 9 disconnected during tests"
              exit 125
            }
          }

          # The caret prevents Expect from matching the echoed command.
          # Plan 9 rc joins the two pieces in the actual output.
          send -- "if(~ \$teststatus '') echo __PLAN9_^PASS__\r"

          expect {
            "__PLAN9_PASS__" {
              set result 0
              exp_continue
            }
            "term%" {}
            timeout {
              puts stderr "Timed out reading test result"
              set result 124
            }
            eof {
              puts stderr "Plan 9 disconnected before reporting result"
              set result 125
            }
          }

          send -- "fshalt\r"

          set timeout 30
          expect {
            "done halting" {}
            eof {}
            timeout {}
          }

          exit $result
          EOF
