---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: test-plan9

on: # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:

env:
  ANYVM_COMMIT: main
  GOVERSION: '1.25.x'
  # See https://github.com/anyvm-org/anyvm/blob/main/.github/workflows/plan9.yml#L37
  PLAN9_RELEASE: '11554'
  SSH_PORT: '10023'

jobs:
  test-plan9:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - name: actions/checkout@v7 anyvm-org/anyvm
        uses: actions/checkout@v7
        with:
          repository: anyvm-org/anyvm
          ref: ${{ env.ANYVM_COMMIT }}
          path: .anyvm
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-go@v7
        with:
          # go-version overrides go-version-file if a value is present
          go-version: ${{ env.GOVERSION }}
          go-version-file: go.mod
          check-latest: true
          cache: true

      - run: printf '::notice ::%s\n' "$(go version)"

      - name: Run tests on Plan9
        shell: bash
        env:
          CGO_ENABLED: 0
          GH_TOKEN: ${{ github.token }}
          GOOS: plan9
          GOARCH: amd64
        run: |
          # Run tests on Plan9
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get --no-install-recommends -y install \
            ca-certificates \
            expect \
            inetutils-telnet \
            qemu-system-x86 \
            qemu-utils \
            zstd

          stage="${RUNNER_TEMP}/plan9-stage"

          rm -rf "${stage}"
          mkdir -p "${stage}"

          # Build one native Plan 9 test executable.
          go test \
            -c \
            -mod=readonly \
            -tags debug \
            -covermode=atomic \
            -coverpkg=. \
            -o "${stage}/compat.test" \
            .

          # Preserve the test's expected relative working directory.
          if [[ -d testdata ]]; then
            cp -a testdata "${stage}/"
          fi

          echo "Files to transfer:"
          du -ah "${stage}"

          # Avoid nested-KVM LBR/PMU problems under act.
          if [[ "${ACT:-}" == "true" ]]; then
            sudo rm -f /dev/kvm
          fi

          # Transfer only compat.test and testdata.
          timeout --signal=TERM 15m \
            python3 .anyvm/anyvm.py \
              --os plan9 \
              --release "${PLAN9_RELEASE}" \
              --data-dir "${RUNNER_TEMP}/anyvm-data" \
              --ssh-port "${SSH_PORT}" \
              --sync 9p \
              -v "${stage}:/usr/glenda/work" \
              -d \
              --remote-vnc no

          python3 ./telnet_to_plan9.py

          du -ah "${stage}"

permissions:
  contents: read
