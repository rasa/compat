---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: build-ios

on: # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:

env:
  CGO_ENABLED: 1
  GOOS: ios
  GOARCH: arm64
  GOVERSION: '1.25.x'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-go@v7
        with:
          # go-version overrides go-version-file if a value is present
          go-version: ${{ env.GOVERSION }}
          go-version-file: go.mod
          check-latest: true
          cache: true

      - run: printf '::notice ::%s\n' "$(go version)"

      - run: go mod download

      - run: go build -trimpath -o ./bin/ ./...

      - run: |
          go test -covermode=atomic -coverprofile=coverage.out -coverpkg=. .
          sed -i.bak "/compat\/cmd\//d; /compat\/golang\//d;" coverage.out
          rm -f *.bak

      # - uses: actions/upload-artifact@v3
      #  with:
      #     name: ios-build
      #     path: build/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          files: ./coverage.out
          name: coverage-${{ env.GOOS }}
          token: ${{ secrets.CODECOV_TOKEN }}

permissions:
  contents: read
