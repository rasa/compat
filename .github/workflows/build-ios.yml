---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: build-ios

"on":
  workflow_call:
  workflow_dispatch:

env:
  CGO_ENABLED: 1
  GOOS: ios
  GOARCH: arm64

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - run: printf '::notice ::%s\n' "$(go version)"

      - run: go mod download

      - run: go build -trimpath -o ./bin/ ./...

permissions:
  contents: read
