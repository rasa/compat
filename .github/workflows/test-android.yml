---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: test-android

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        # Representative major Android releases:
        # 21: Android 5
        # 23: Android 6
        # 26: Android 8
        # 29: Android 10
        # 31: Android 12
        # 34: Android 14
        # 35: Android 15
        # 36: Android 16
        # For API level 36:
        # stat /usr/local/lib/android/sdk/ndk/27.3.13750724/toolchains/
        # llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android36-clang: no such file or directory
        api_level: [21, 23, 26, 29, 31, 35]
        # QEMU2 emulator does not support arm64 CPU architecture
        goarch: [386] # amd64, arm64
        target: [default, google_apis]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Map GOARCH to Android architecture
        shell: bash
        run: |
          case "${{ matrix.goarch }}" in
          amd64)
            ARCH="x86_64"
            NDK_ARCH="x86_64"
            ;;
          arm64)
            ARCH="arm64-v8a"
            NDK_ARCH="aarch64"
            ;;
          386)
            ARCH="x86"
            NDK_ARCH="i686"
            ;;
          *)
            echo "::error::Unsupported GOARCH: ${{ matrix.goarch }}"
            exit 1
            ;;
          esac
          echo "ARCH=${ARCH}" >> "$GITHUB_ENV"
          echo "NDK_ARCH=${NDK_ARCH}" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create Android execution wrapper
        run: |
          cmd="${RUNNER_TEMP}/run-on-android"
          : >"${cmd}"
          chmod +x "${cmd}"
          cat >>"${cmd}" <<'EOF'
          #!/usr/bin/env bash
          set -vx
          set -euo pipefail

          test_bin="$1"
          shift

          tmp1="/data/local/tmp/go-test-$$"
          adb shell mkdir -p "${tmp1}"
          trap "adb shell rm -rf ${tmp1} >/dev/null" EXIT

          testdata="${PWD}/testdata"
          if test -d "${testdata}"; then
            adb push "${testdata}" "${tmp1}/testdata" >/dev/null
          fi
          test_cmd="${tmp1}/test"
          adb push "${test_bin}" "${test_cmd}" >/dev/null
          adb shell chmod 755 "${test_cmd}"

          # API 21 adb shell does not propagate the remote exit status.
          # Save it on the device and retrieve it afterward.
          exit_code_file="${tmp1}/exit-code"
          set +e
          adb shell cd "${tmp1}" \; "${test_cmd}" "$@" \; echo \$? \> "${exit_code_file}"
          exit_code=$?
          set -e

          if (( exit_code != 0 )); then
            echo "'go test .' failed with status ${exit_code}" >&2
            exit "${exit_code}"
          fi

          exit_code=$(adb shell cat "${exit_code_file}")
          exit_code="${exit_code//$'\n'/}"
          exit_code="${exit_code//$'\r'/}"
          case "${exit_code}" in
            ''|*[!0-9]*)
              echo "Invalid or missing Android test exit status: ${exit_code@Q}" >&2
              exit 1
              ;;
          esac
          exit "${exit_code}"
          EOF
  
      - name: Run Go tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        with:
          api-level: ${{ matrix.api_level }}
          ndk: 29.0.14206865
          target: ${{ matrix.target }}
          arch: ${{ env.ARCH }}
          # default: true
          # disable-animations: true
          # the default:
          # emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # -count=1 disables test caching
          script: >-
            CC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ env.NDK_ARCH }}-linux-android${{ matrix.api_level }}-clang"
            go test -exec "${RUNNER_TEMP}/run-on-android" -count=1 -v .

          # ls -l ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt
          #  ls -l ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin
