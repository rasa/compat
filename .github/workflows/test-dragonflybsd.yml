---
# yaml-language-server: $schema https://json.schemastore.org/github-workflow.json

name: test-dragonflybsd

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      GOOPTS:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      GOOPTS:
        type: string
        default: ''
        description: 'Build/test options (eg: -tags fstat)'

env:
  CODECOV_SLUG: ${{ github.repository }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  GOOS: dragonfly
  GOARCH: amd64
  GOOPTS: ${{ inputs.GOOPTS }}
jobs:
  test-dragonflybsd:
    name: test-dragonflybsd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false

      - uses: vmactions/dragonflybsd-vm@v1
        with:
          envs: 'GOOS GOARCH GOOPTS CODECOV_SLUG CODECOV_TOKEN' # GITHUB_TOKEN'
          usesh: true
          sync: scp
          # copyback: false
          prepare: |
            pkg update -f
            pkg install -y bash coreutils curl git gzip gtar jq
            cd /usr/local/bin && ln -sf gsha256sum sha256sum
            # pkg install -y go
          run: |
            ./download-build-test.sh

      - uses: codecov/codecov-action@v7
        with:
          # fail_ci_if_error: false
          files: ./coverage.out
          name: coverage-${{ env.GOOS }}
          token: ${{ secrets.CODECOV_TOKEN }}

permissions:
  contents: read
